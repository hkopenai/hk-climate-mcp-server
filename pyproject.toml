[build-system]
requires = [ "setuptools>=42", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "hkopenai.hk_climate_mcp_server"
version = "0.4.1"
description = "Hong Kong Weather MCP Server providing climate and weather data tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [ "Programming Language :: Python :: 3", "Operating System :: OS Independent",]
dependencies = [ "fastmcp>=2.10.2", "requests>=2.31.0", "pytest>=8.2.0", "pytest-cov>=6.1.1", "modelcontextprotocol", "hkopenai_common",]
[[project.authors]]
name = "Neo Chow"
email = "neo@01man.com"

[project.urls]
repository = "https://github.com/hkopenai/hk-climate-mcp-server.git"

[project.scripts]
hk_climate_mcp_server = "hkopenai.hk_climate_mcp_server.__main__:main"

[tool.setuptools]
packages = [ "hkopenai.hk_climate_mcp_server",]
include-package-data = true

[tool.bandit]
exclude_dirs = [ "venv", ".venv", "tests",]

[tool.hatch.build.targets.wheel]
packages = [ "hkopenai",]

[tool.pytest.ini_options]
# `live` marker is auto-applied by live_tests/conftest.py to every test
# collected from that directory. The CI workflow uses `-m "not live"`
# to deselect them (they hit external APIs).
markers = [
    "live: marks tests as live (external API calls)",
]
